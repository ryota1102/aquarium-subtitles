<script>
const cues=["大家～～好！", "再過幾分鐘，企鵝解說活動就要開始囉！活動就在前面的『海風圓頂劇場（Umikaji Dome）』舉行，歡迎大家一起過來看看！", "今天非常感謝大家來到 DMM Kariyushi 水族館！我是調查員，請大家多多指教！", "其實我啊……剛剛都還在發掘現場進行調查……", "可是我太想跟大家聊聊天了，所以就偷偷溜出來啦！", "這件事……要幫我對隊長保密喔？", "對了，各位！大家有沒有親手挖掘過真正的化石呢？", "喔！好像有人挖過耶？那麼……", "如果可以親手找到幾千萬年前真正的化石……大家想不想試試看！？", "喔～～！果然會想試試看對吧！", "其實啊，我今天特地來見大家，是有一個重要原因的。", "不過在說那件事之前……大家對企鵝到底了解多少呢？", "大家知道企鵝平常都吃什麼嗎？牠們住在哪裡呢？", "大家知道企鵝在生物的分類裡，屬於哪一類嗎？", "有沒有人知道呢？", "沒錯！是鳥類！也就是說，企鵝其實就是鳥的一種喔！", "不過，大家可能會想：企鵝明明是鳥，為什麼卻不會飛呢？", "其實，大家可能不知道，研究認為企鵝在很久很久以前，原本是『會飛的鳥』喔！", "追溯企鵝的演化歷程，可以發現牠們在演化的過程中，逐漸適應了海洋生活。從『會飛的鳥』，慢慢變成『能潛入海裡的鳥』，最後變成『能在海裡游泳的鳥』。就是這樣一路演化過來的。", "而且，如果我們再繼續往前追溯牠們的祖先，還會發現一件很有趣的事情！", "有研究結果指出，企鵝非常非常久以前的祖先，可能是一種生活在陸地上的肉食性恐龍喔！", "大家應該都知道一種很有名的恐龍吧？就是——暴龍！", "暴龍，以及與鳥類祖先有關的恐龍，都屬於『獸腳類』這一類的恐龍。而鳥類，就是從其中一部分恐龍演化而來，一直延續到現在的喔！", "所以，我們常常會覺得恐龍已經全部消失了，但其實，其中一部分恐龍演化成了鳥類，一直延續到今天，就生活在我們身邊喔！", "不過，仔細想想，大家是不是也覺得有點不可思議呢？", "暴龍生活的年代，可是距離現在已經超過 6,600 萬年了。", "當然，不可能有人親眼看過牠們，也沒有留下照片或影片。那麼，我們到底是怎麼知道鳥類和恐龍之間有關係的呢？", "其實，是因為我們發現了一個解開這個謎團、非常重要的線索！", "那就是——「化石」！", "化石，是生物的骨頭或牙齒等，在土壤中經過非常漫長的時間，逐漸變成像石頭一樣的東西。所以，化石裡其實藏著非常多的資訊喔！", "它就像是證明這些生物，真的曾經生活在古代地球上的重要證據！是不是覺得有點興奮呢？", "在地球漫長的歷史中，海洋可能變成陸地，陸地也可能再次變成海洋，地球上的環境一直不斷地變化。", "就這樣經過了非常非常漫長的時間，這些生物最後以「化石」的形式，來到了我們今天的世界。", "那麼，再讓我們回到更久以前。在恐龍生活的那個時代，當時的海洋裡，又生活著哪些生物呢？", "現在，讓我們把時間倒轉，回到——白堊紀！", "其實在這個時代，海洋裡也生活著許多巨大生物。", "其中最具代表性的，就是——滄龍！", "牠們身形巨大、牙齒銳利，是生活在白堊紀海洋中的爬蟲類動物，和現在的蜥蜴有著親緣關係。", "不過，當時生活在海裡的，可不只有這些巨大生物喔！", "大家有沒有看過這個呢？", "沒錯！這就是一顆貨真價實的菊石化石！", "這個看起來像石頭一樣的東西，其實是曾經生活在大約 6,600 萬年前的生物喔！", "而經過漫長的時間之後，牠就以化石的樣子出現在我們現在的世界裡。", "很多人可能會以為菊石是貝類的一種，但其實牠們和現在的魷魚、章魚比較接近喔！", "滄龍、古代鯊魚、菊石……和現在水族館裡看到的生物不同，這些古老的生物，曾經生活在很久以前的海洋裡！", "而解開這些謎團的重要線索，就是我們眼前的化石！", "大約 7,000 萬年前生活在地球上的恐龍們，經過漫長歲月，終於以不同的形式來到了現代。化石，就是牠們曾經活過的證明！透過研究化石，我們就能了解到生物以及地球的許多不可思議之處！", "對了，各位！還記得我一開始問大家的問題嗎？", "想要親手挖掘真正化石的人～～！？", "喔～～！果然會想試試看對吧！", "其實……真的可以喔！！", "就在這附近的發掘現場，大家可以親自化身為發掘調查員，挖掘真正的化石！", "可以挖到的是……古代鯊魚的牙齒！還有——菊石化石！", "到底會挖到哪一種呢？要等挖開之後才知道喔！", "而且，自己親手挖出來的真正化石，可以直接帶回家喔！", "體驗時間大約 10 分鐘！費用每次 2,000 日圓！", "這是一塊在地球中沉睡了幾千萬年的歷史碎片。", "今天不只是用眼睛看，接下來，要不要換大家親手把它挖出來呢？", "想試試看的人！這場表演結束後，就直接前往發掘現場吧！", "啊……！！", "我也得趕快回發掘現場了，不然又要被隊長罵啦！！", "那麼大家——", "我們發掘現場見～～！！"]; let i=-1;
const s=document.getElementById('subtitle'), c=document.getElementById('count');
